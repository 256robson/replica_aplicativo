[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gbmap"
version = "0.1.0"
description = "CLI para gerenciar tabelas e campos de mapeamento (GB_SYS_TABMAP / GB_SYS_FLDMAP) em SQL Server."
requires-python = ">=3.8"
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "sqlalchemy>=1.4,<3",
    "pyodbc>=5",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
gbmap = "gbmap.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
